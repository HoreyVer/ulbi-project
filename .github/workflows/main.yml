name: linting, testing, building
on:
  push:
    branches: [ add-playwright ]
  pull_request:
    branches: [ master ]
jobs:
  pipeline:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [ 17.x ]

    steps:
      - uses: actions/checkout@v4

      - name: Staring Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: install modules
        run: npm install

      - name: build production project
        run: npm run build:prod

      - name: linting typescript
        run: npm run lint:ts

      - name: linting css
        run: npm run lint:scss

      - name: unit testing
        run: npm run test:unit

      - name: build storybook
        run: npm run storybook:build

      - name: screenshot testing
        env:
            PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium-browser
            NODE_OPTIONS: "--experimental-fetch --require=./playwright-polyfill.js"
        run: |
            echo "
            // Обманываем проверку версии Playwright
            Object.defineProperty(process, 'version', { value: 'v18.0.0', writable: true });
            
            // Добавляем недостающие классы
            globalThis.GlobalRequest = globalThis.Request;
            const webStreams = require('node:stream/web');
            globalThis.TransformStream = webStreams.TransformStream;
            globalThis.ReadableStream = webStreams.ReadableStream;
            globalThis.WritableStream = webStreams.WritableStream;
            " > playwright-polyfill.js
            
            npm run test:ui:ci